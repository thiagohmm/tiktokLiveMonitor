<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Monitor de Live TikTok</title>
    <style>
        :root {
            --bg: #0b0d12;
            --card: rgba(24, 28, 38, 0.82);
            --border: rgba(255, 255, 255, 0.08);
            --pink: #fe2c55;
            --pink-soft: #ff5a7e;
            --cyan: #25f4ee;
            --text: #f2f3f5;
            --text-muted: #9aa0aa;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 85% -10%, color-mix(in srgb, var(--cyan) 10%, transparent), transparent 60%),
                radial-gradient(800px 400px at -10% 10%, color-mix(in srgb, var(--pink) 14%, transparent), transparent 55%),
                var(--bg);
        }
        .card {
            width: min(440px, 100%);
            padding: 28px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
        }
        p {
            margin: 0 0 20px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 18%, transparent);
        }
        input:disabled { opacity: 0.6; }
        button[type="submit"] {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--pink), var(--pink-soft));
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .error, .success {
            display: none;
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .error { background: rgba(220, 38, 38, 0.15); color: #fecaca; }
        .success { background: rgba(22, 163, 74, 0.16); color: #bbf7d0; }
        .error.visible, .success.visible { display: block; }
        .hint { font-size: 0.8rem; color: var(--text-muted); margin: -8px 0 14px; }
        .back-row { margin-top: 14px; }
        .back-row a { color: var(--cyan); font-size: 0.85rem; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Redefinir senha</h1>
        <p>Escolha uma nova senha para a sua conta.</p>
        <div id="resetError" class="error"></div>
        <div id="resetSuccess" class="success"></div>

        <form id="resetForm">
            <label for="newPassword">Nova senha</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            <div class="hint">Mínimo de 8 caracteres.</div>
            <label for="confirmPassword">Confirmar nova senha</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button id="resetBtn" type="submit">Redefinir senha</button>
            <div class="back-row"><a href="/login.html">Ir para o login</a></div>
        </form>
    </div>

    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <script>
        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmInput = document.getElementById('confirmPassword');
        const errorBox = document.getElementById('resetError');
        const successBox = document.getElementById('resetSuccess');

        // O Supabase redireciona para o redirect_to com o token no hash:
        // #access_token=...&type=recovery&code=...
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const accessToken = hashParams.get('access_token') || '';
        const linkType = hashParams.get('type') || '';

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('visible');
            successBox.classList.remove('visible');
        }

        function hideError() {
            errorBox.classList.remove('visible');
        }

        function showSuccess(message) {
            successBox.textContent = message;
            successBox.classList.add('visible');
            errorBox.classList.remove('visible');
        }

        function disableForm() {
            newPasswordInput.disabled = true;
            confirmInput.disabled = true;
            resetBtn.disabled = true;
        }

        (async function init() {
            await window.TLMAuth.loadAuthConfig();
            if (!accessToken || linkType !== 'recovery') {
                disableForm();
                showError('Link inválido ou expirado. Solicite uma nova redefinição de senha.');
                return;
            }
        })();

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideError();
            hideSuccess();
            const password = newPasswordInput.value;
            if (password.length < 8) {
                showError('A nova senha deve ter pelo menos 8 caracteres.');
                return;
            }
            if (password !== confirmInput.value) {
                showError('As senhas não conferem.');
                return;
            }
            resetBtn.disabled = true;
            try {
                await window.TLMAuth.resetPassword(accessToken, password);
                showSuccess('Senha redefinida com sucesso. Redirecionando para o login...');
                setTimeout(() => { window.location.href = '/login.html'; }, 1500);
            } catch (error) {
                showError(error.message || 'Não foi possível redefinir a senha.');
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
