# nginx do frontend: serve os arquivos estáticos e faz proxy da API
# (SSE + REST) para o backend Go. Assim o navegador vê tudo na mesma
# origem — sem CORS. BACKEND_URL é injetado no build (envsubst).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /admin (ou /Admin) serve a pagina dedicada de administracao direto
    # (sem redirect: 301 do nginx perde a porta nao-padrao, ex.: :8080).
    location ~* ^/admin$ {
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }

    # API e SSE -> backend (proxy_buffering desligado para o stream).
    location ~ ^/(api|events) {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache: HTML sempre fresco; assets com revalidação.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
    location ~* \.(js|css|png|svg|json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri /index.html;
    }
}
