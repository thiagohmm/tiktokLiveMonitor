<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Monitor de Live TikTok</title>
    <style>
        :root {
            --bg: #0b0d12;
            --card: rgba(24, 28, 38, 0.82);
            --border: rgba(255, 255, 255, 0.08);
            --pink: #fe2c55;
            --pink-soft: #ff5a7e;
            --cyan: #25f4ee;
            --text: #f2f3f5;
            --text-muted: #9aa0aa;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 85% -10%, color-mix(in srgb, var(--cyan) 10%, transparent), transparent 60%),
                radial-gradient(800px 400px at -10% 10%, color-mix(in srgb, var(--pink) 14%, transparent), transparent 55%),
                var(--bg);
        }
        .card {
            width: min(440px, 100%);
            padding: 28px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
        }
        p {
            margin: 0 0 20px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 18px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }
        .tab {
            padding: 10px 12px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
        }
        .tab.active {
            color: white;
            background: linear-gradient(135deg, var(--pink), var(--pink-soft));
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        input, textarea {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font: inherit;
        }
        textarea { min-height: 72px; resize: vertical; }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 18%, transparent);
        }
        input:disabled, textarea:disabled { opacity: 0.6; }
        button[type="submit"], .primary {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--pink), var(--pink-soft));
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .error, .success {
            display: none;
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .error { background: rgba(220, 38, 38, 0.15); color: #fecaca; }
        .success { background: rgba(22, 163, 74, 0.16); color: #bbf7d0; }
        .error.visible, .success.visible { display: block; }
        .attempts {
            margin: -6px 0 14px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .attempts.hidden { display: none; }
        .hidden { display: none !important; }
        .hint { font-size: 0.8rem; color: var(--text-muted); margin: -8px 0 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Monitor de Live TikTok</h1>
        <div class="tabs">
            <button class="tab active" type="button" data-tab="login">Entrar</button>
            <button class="tab" type="button" data-tab="signup">Criar conta</button>
        </div>
        <p id="panelHint">Entre com o e-mail e a senha da sua assinatura.</p>
        <div id="loginError" class="error"></div>
        <div id="loginSuccess" class="success"></div>
        <div id="attemptsInfo" class="attempts hidden"></div>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="loginBtn" type="submit">Entrar</button>
        </form>

        <form id="signupForm" class="hidden">
            <label for="signupEmail">E-mail</label>
            <input id="signupEmail" name="email" type="email" autocomplete="email" required>
            <label for="signupPassword">Senha</label>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <div class="hint">Mínimo de 8 caracteres.</div>
            <label for="signupName">Nome (opcional)</label>
            <input id="signupName" name="displayName" type="text" autocomplete="name">
            <label for="signupNotes">Pagamento (opcional)</label>
            <textarea id="signupNotes" name="notes" placeholder="PIX, nome no comprovante ou outra referência para o administrador aprovar."></textarea>
            <button id="signupBtn" type="submit">Enviar cadastro</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorBox = document.getElementById('loginError');
        const successBox = document.getElementById('loginSuccess');
        const attemptsInfo = document.getElementById('attemptsInfo');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const panelHint = document.getElementById('panelHint');

        let lockoutTimer = null;
        let currentTab = 'login';

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('visible');
            successBox.classList.remove('visible');
        }

        function hideError() {
            errorBox.classList.remove('visible');
        }

        function showSuccess(message) {
            successBox.textContent = message;
            successBox.classList.add('visible');
            errorBox.classList.remove('visible');
        }

        function hideSuccess() {
            successBox.classList.remove('visible');
        }

        function showAttempts(message) {
            attemptsInfo.textContent = message;
            attemptsInfo.classList.remove('hidden');
        }

        function hideAttempts() {
            attemptsInfo.classList.add('hidden');
        }

        function setFormLocked(locked) {
            loginBtn.disabled = locked;
            passwordInput.disabled = locked;
        }

        function clearLockoutTimer() {
            if (lockoutTimer) {
                clearInterval(lockoutTimer);
                lockoutTimer = null;
            }
        }

        function startLockoutCountdown(seconds) {
            clearLockoutTimer();
            let remaining = Math.max(1, Number(seconds) || 0);
            setFormLocked(true);
            signupBtn.disabled = true;

            function tick() {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                const clock = mins > 0
                    ? mins + ' min ' + String(secs).padStart(2, '0') + ' s'
                    : secs + ' s';
                showError('Muitas tentativas. Tente novamente em ' + clock + '.');
                if (remaining <= 0) {
                    clearLockoutTimer();
                    hideError();
                    setFormLocked(false);
                    signupBtn.disabled = false;
                    return;
                }
                remaining -= 1;
            }

            tick();
            lockoutTimer = setInterval(tick, 1000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(button => {
                button.classList.toggle('active', button.dataset.tab === tab);
            });
            loginForm.classList.toggle('hidden', tab !== 'login');
            signupForm.classList.toggle('hidden', tab !== 'signup');
            hideError();
            hideAttempts();
            if (tab === 'login') {
                panelHint.textContent = 'Entre com o e-mail e a senha da sua assinatura.';
            } else {
                panelHint.textContent = 'Crie a conta. O acesso só é liberado depois que o administrador confirmar o pagamento.';
            }
        }

        document.querySelectorAll('.tab').forEach(button => {
            button.addEventListener('click', () => switchTab(button.dataset.tab));
        });

        (async function init() {
            await window.TLMAuth.loadAuthConfig();
            const response = await fetch('/api/auth/config');
            const config = await response.json();
            if (!config.enabled) {
                window.location.href = '/';
            }
        })();

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideError();
            hideSuccess();
            loginBtn.disabled = true;
            try {
                await window.TLMAuth.signIn(emailInput.value, passwordInput.value);
                const next = new URLSearchParams(window.location.search).get('next');
                window.location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
            } catch (error) {
                if (error.locked && error.retryAfterSec) {
                    startLockoutCountdown(error.retryAfterSec);
                } else {
                    showError(error.message || 'Não foi possível entrar.');
                    if (typeof error.remainingAttempts === 'number') {
                        showAttempts('Tentativas restantes: ' + error.remainingAttempts);
                    }
                }
            } finally {
                if (!lockoutTimer) {
                    loginBtn.disabled = false;
                }
            }
        });

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideError();
            hideSuccess();
            signupBtn.disabled = true;
            try {
                const result = await window.TLMAuth.signUp({
                    email: document.getElementById('signupEmail').value,
                    password: document.getElementById('signupPassword').value,
                    displayName: document.getElementById('signupName').value,
                    notes: document.getElementById('signupNotes').value,
                });
                signupForm.reset();
                switchTab('login');
                showSuccess(result.message || 'Cadastro recebido. Após o pagamento, o administrador libera o acesso.');
            } catch (error) {
                if (error.locked && error.retryAfterSec) {
                    startLockoutCountdown(error.retryAfterSec);
                } else {
                    showError(error.message || 'Não foi possível concluir o cadastro.');
                }
            } finally {
                if (!lockoutTimer) {
                    signupBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
