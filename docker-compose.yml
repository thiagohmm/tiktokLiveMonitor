# Uso padrão (servidores/PCs — build nativo na arquitetura da máquina).
# Versão lite, sem IA: sem llama-server/GGUF e sem agente Python.
# Para Raspberry Pi, use o compose dedicado:
#   docker compose -f docker-compose.raspberry.yml up -d

services:
  tiktok-live-monitor:
    build:
      context: .
      # SKIP_TESTS=1 pula a etapa de `go test` no build (configure no .env).
      args:
        SKIP_TESTS: ${SKIP_TESTS:-}
    ports:
      - "${PORT:-3001}:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
    volumes:
      # Persiste o feedback.db (SQLite do app) entre restarts.
      - monitor-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/api/state || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  monitor-data:
