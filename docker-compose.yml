# Uso padrão (servidores/PCs — build nativo na arquitetura da máquina).
# Para Raspberry Pi, use o compose dedicado:
#   docker compose -f docker-compose.raspberry.yml up -d

services:
  tiktok-live-monitor:
    build:
      context: .
      # SKIP_TESTS=1 pula a etapa de `go test` no build (configure no .env).
      args:
        SKIP_TESTS: ${SKIP_TESTS:-}
    ports:
      - "${PORT:-3000}:3000"
      - "${LLAMA_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LLAMA_SERVER_BIND: "0.0.0.0"
    shm_size: "${LLAMA_SHM_SIZE:-512mb}"
    volumes:
      - llm-models:/app/models
      - llm-bin:/app/bin
      - feedback-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/state || exit 1"]
      interval: 30s
      timeout: 10s
      # No primeiro boot o container baixa o GGUF e o binário llama-server.
      start_period: 60s
      retries: 5

  # Opcional: worker de IA dedicado (outro host com GPU/CPU mais forte).
  # O monitor sobe sem IA local (fallback regex) e delega ao worker.
  # ai-worker:
  #   build: .
  #   command: ["sleep", "infinity"]
  #   environment:
  #     MASTER_URL: "http://tiktok-live-monitor:3000"
  #     WORKER_PORT: "8081"
  #   volumes:
  #     - llm-models:/app/models
  #     - llm-bin:/app/bin
  #   depends_on:
  #     - tiktok-live-monitor

volumes:
  llm-models:
  llm-bin:
  feedback-data:
