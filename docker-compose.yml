services:
  tiktok-live-monitor:
    build: .
    ports:
      - "${PORT:-3000}:3000"
      - "${LLAMA_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LLAMA_SERVER_BIND: "0.0.0.0"
      LLAMA_USE_MMAP: "1"
    shm_size: "512mb"
    volumes:
      - llm-models:/app/models
      - llm-bin:/app/bin
      - feedback-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/state"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Optional AI worker - runs llama-server on a separate machine with GPU.
  # Uncomment and configure if you have a dedicated GPU node.
  # ai-worker:
  #   build: .
  #   command: /bin/sh -c "echo 'Worker mode: spawn llama-server manually' && sleep infinity"
  #   environment:
  #     MASTER_URL: "http://tiktok-live-monitor:3000"
  #     WORKER_PORT: "8081"
  #   shm_size: "512mb"
  #   volumes:
  #     - llm-models:/app/models
  #     - llm-bin:/app/bin
  #   depends_on:
  #     - tiktok-live-monitor

volumes:
  llm-models:
  llm-bin:
  feedback-data:
