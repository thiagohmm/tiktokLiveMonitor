services:
  tiktok-live-monitor:
    build: .
    ports:
      - "${PORT:-3000}:3000"
      - "${LLAMA_HOST_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LLAMA_SERVER_BIND: "0.0.0.0"
      LLAMA_USE_MMAP: "1"
    shm_size: "512mb"
    volumes:
      - llm-models:/app/models
      - llm-bin:/app/bin
      - feedback-data:/app

  # AI worker can still run the llama-server on a separate node.
  ai-worker:
    build: .
    command: /bin/sh -c "echo 'Worker mode: spawn llama-server manually or use sidecar' && sleep infinity"
    environment:
      MASTER_URL: "http://tiktok-live-monitor:3000"
      WORKER_PORT: "8081"
    shm_size: "512mb"
    volumes:
      - llm-models:/app/models
      - llm-bin:/app/bin
    depends_on:
      - tiktok-live-monitor

volumes:
  llm-models:
  llm-bin:
  feedback-data:
