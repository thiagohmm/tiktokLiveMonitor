map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name livemonitortk.com.br www.livemonitortk.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# O bloco HTTPS é ativado pelo script de instalação depois da emissão do
# certificado. Mantê-lo ausente no primeiro boot permite o ACME funcionar.
