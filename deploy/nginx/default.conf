map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream app_frontend { server tiktok-live-monitor-frontend-1:80; }
server {
    listen 80;
    server_name livemonitortk.com.br www.livemonitortk.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name livemonitortk.com.br www.livemonitortk.com.br;
    ssl_certificate /etc/letsencrypt/live/livemonitortk.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livemonitortk.com.br/privkey.pem;
    location = /tiktokzeFEve6nx7at0yrYrJ4BtnvtPks2wEr1.txt {
        alias /var/www/certbot/tiktokzeFEve6nx7at0yrYrJ4BtnvtPks2wEr1.txt;
        default_type text/plain;
    }
    location = /agenttk/tiktok1R7WUAi1CSEQsYIfidgWHoN4O90ms6Pb.txt {
        alias /var/www/certbot/tiktok1R7WUAi1CSEQsYIfidgWHoN4O90ms6Pb.txt;
        default_type text/plain;
    }
    location ^~ /media/ {
        alias /var/www/certbot/agenttk-media/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /agenttk { return 302 /agenttk/; }
    location ^~ /agenttk/ {
        proxy_pass http://agenttk-oauth:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        access_log off;
    }
    location / {
        proxy_pass http://app_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name sigmenta.com.br www.sigmenta.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigmenta.com.br www.sigmenta.com.br;
    ssl_certificate /etc/letsencrypt/live/sigmenta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigmenta.com.br/privkey.pem;
    location / {
        proxy_pass http://172.30.0.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
