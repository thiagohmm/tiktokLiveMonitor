# Docker Compose dedicado para Raspberry Pi (arm64).
#
# Uso direto na Pi (recomendado — build nativo, mais rápido que cross-build via QEMU):
#   docker compose -f docker-compose.raspberry.yml up -d
#
# Em outro host (ex.: Mac/servidor) gerando a imagem para transferir à Pi:
#   docker compose -f docker-compose.raspberry.yml build
#   docker save tiktok-live-monitor | ssh pi 'docker load'
#   (na Pi) docker compose -f docker-compose.raspberry.yml up -d
#
# Ajustes finos via .env: LLAMA_SHM_SIZE (256mb p/ Pi 1GB/2GB), SKIP_TESTS.

services:
  tiktok-live-monitor:
    build:
      context: .
      args:
        # Na Pi a compilação é lenta: pula os testes por padrão.
        SKIP_TESTS: ${SKIP_TESTS:-1}
    # Garante a arquitetura certa mesmo buildando fora da Pi (buildx/QEMU).
    platform: linux/arm64
    ports:
      - "${PORT:-3000}:3000"
      - "${LLAMA_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LLAMA_SERVER_BIND: "0.0.0.0"
      # 1 = memória mapeada do modelo (necessário na Pi 4 p/ modelos grandes)
      LLAMA_USE_MMAP: "1"
    # Pi 4 1GB/2GB: 256mb | Pi 4 4GB/8GB: 512mb (padrão)
    shm_size: "${LLAMA_SHM_SIZE:-512mb}"
    volumes:
      - llm-models:/app/models
      - llm-bin:/app/bin
      - feedback-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/state || exit 1"]
      interval: 30s
      timeout: 10s
      # No primeiro boot o container baixa o GGUF e o binário llama-server
      # (arm64 na Pi). Em conexões lentas isso pode levar 10+ minutos.
      start_period: 600s
      retries: 5

volumes:
  llm-models:
  llm-bin:
  feedback-data:
