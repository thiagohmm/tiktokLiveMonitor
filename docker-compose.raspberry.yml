# Docker Compose dedicado para Raspberry Pi (arm64) — versão lite, sem IA.
#
# Uso direto na Pi (recomendado — build nativo, mais rápido que cross-build via QEMU):
#   docker compose -f docker-compose.raspberry.yml up -d --build
#
# Em outro host (ex.: Mac/servidor) gerando a imagem para transferir à Pi:
#   docker compose -f docker-compose.raspberry.yml build
#   docker save tiktok-live-monitor | ssh pi 'docker load'
#   (na Pi) docker compose -f docker-compose.raspberry.yml up -d
#
# Sem llama-server/GGUF e sem agente Python: nada de porta 8080, shm_size ou
# download de modelos. O primeiro boot é só a compilação Go+CGO do SQLite.

services:
  tiktok-live-monitor:
    build:
      context: .
      args:
        # Na Pi a compilação é lenta: pula os testes por padrão.
        SKIP_TESTS: ${SKIP_TESTS:-1}
    # Garante a arquitetura certa mesmo buildando fora da Pi (buildx/QEMU).
    platform: linux/arm64
    ports:
      - "${PORT:-3001}:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
    volumes:
      # Persiste o feedback.db (SQLite do app) entre restarts.
      - monitor-data:/app
      # Bind mount (lê) após o volume /app para que atualizações de web/ no
      # repo sejam servidas direto após restart do container, sem ficarem
      # presas na cópia do volume.
      - ./web:/app/web:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/api/state || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  monitor-data:
