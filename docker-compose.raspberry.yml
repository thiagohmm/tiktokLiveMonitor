# Docker Compose dedicado para Raspberry Pi (arm64) — versão lite, sem IA.
#
# Uso direto na Pi (recomendado — build nativo, mais rápido que cross-build via QEMU):
#   docker compose -f docker-compose.raspberry.yml up -d --build
#
# Em outro host (ex.: Mac/servidor) gerando a imagem para transferir à Pi:
#   docker compose -f docker-compose.raspberry.yml build
#   docker save tiktok-live-monitor | ssh pi 'docker load'
#   (na Pi) docker compose -f docker-compose.raspberry.yml up -d
#
# Sem llama-server/GGUF e sem agente Python: nada de porta 8080, shm_size ou
# download de modelos. O primeiro boot é só a compilação Go+CGO do SQLite.

services:
  tiktok-live-monitor:
    build:
      context: .
      args:
        # Na Pi a compilação é lenta: pula os testes por padrão.
        SKIP_TESTS: ${SKIP_TESTS:-1}
    # Garante a arquitetura certa mesmo buildando fora da Pi (buildx/QEMU).
    platform: linux/arm64
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3001}:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DB_DIR: "/data"
      AUTH_ENABLED: ${AUTH_ENABLED:-1}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      AUTH_THEME_PINK: ${AUTH_THEME_PINK:-#fe2c55}
      AUTH_THEME_CYAN: ${AUTH_THEME_CYAN:-#25f4ee}
      AUTH_THEME_BG: ${AUTH_THEME_BG:-#0b0d12}
    volumes:
      # Persiste apenas o feedback.db (SQLite do app). O restante de /app vem
      # sempre da imagem — assim atualizações de binário/bridge pegam no
      # primeiro restart, sem volume congelando arquivos antigos.
      - monitor-data:/data
      # Bind mount (lê) da UI: alterações em web/ no repo são servidas direto
      # após restart do container, sem rebuild da imagem.
      - ./web:/app/web:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/api/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  monitor-data:
