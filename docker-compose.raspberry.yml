# Docker Compose dedicado para Raspberry Pi (arm64) — versão lite, sem IA.
#
# Uso direto na Pi (recomendado — build nativo, mais rápido que cross-build via QEMU):
#   docker compose -f docker-compose.raspberry.yml up -d --build
#
# Em outro host (ex.: Mac/servidor) gerando a imagem para transferir à Pi:
#   docker compose -f docker-compose.raspberry.yml build
#   docker save tiktok-live-monitor | ssh pi 'docker load'
#   (na Pi) docker compose -f docker-compose.raspberry.yml up -d
#
# Sem llama-server/GGUF e sem agente Python: nada de shm_size nem download de
# modelos. O primeiro boot é só a compilação Go (puro, sem CGO) + npm ci da
# bridge Node.
#
# Este compose sobre apenas a API Go + PostgreSQL local (dados persistidos em
# `postgres-data`). O frontend roda em /frontend (nginx/Vercel/dev server
# local apontando para http://PI_IP:3001).
#
# Para usar um Supabase externo em vez do Postgres local, defina
# `DATABASE_URL` no `.env` (URL do pooler).

services:
  postgres:
    image: postgres:17-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiktok_live_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-tlm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tlm-local-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  tiktok-live-monitor:
    build:
      context: ./backend
      args:
        # Na Pi a compilação é lenta: pula os testes por padrão.
        SKIP_TESTS: ${SKIP_TESTS:-1}
    # Garante a arquitetura certa mesmo buildando fora da Pi (buildx/QEMU).
    platform: linux/arm64
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3001}:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      AUTH_ENABLED: ${AUTH_ENABLED:-1}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Padrão aponta para o Postgres local deste compose; defina DATABASE_URL
      # no .env para usar o Supabase (pooler) e ignorar o serviço postgres.
      DATABASE_URL: ${DATABASE_URL:-postgres://tlm:tlm-local-dev-only@postgres:5432/tiktok_live_monitor?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      AUTH_THEME_PINK: ${AUTH_THEME_PINK:-#fe2c55}
      AUTH_THEME_CYAN: ${AUTH_THEME_CYAN:-#25f4ee}
      AUTH_THEME_BG: ${AUTH_THEME_BG:-#0b0d12}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/api/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  postgres-data: